server.port=8082
spring.application.name=product-service

# Cấu hình kết nối SQL Server (Tài khoản sa / 123)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=clothing_product_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate tự sinh bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect