server.port=8083
spring.application.name=order-service

# Kết nối database riêng biệt clothing_order_db trên SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=clothing_order_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate tự động đồng bộ bảng dữ liệu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect